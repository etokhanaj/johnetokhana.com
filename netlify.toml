[build]
  command = "npm run build"

# Case studies moved under /work/ in the redesign; keep old links working.
[[redirects]]
  from = "/rivva"
  to = "/work/rivva/"
  status = 301

[[redirects]]
  from = "/kora"
  to = "/work/kora/"
  status = 301

[[redirects]]
  from = "/episode"
  to = "/work/episode/"
  status = 301

[[redirects]]
  from = "/milkyway"
  to = "/work/milkyway/"
  status = 301

# Security headers on every response. frame-ancestors / X-Frame-Options stop
# other sites framing these pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
